global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: hello-service
    metrics_path: /metrics
    static_configs:
      - targets: ["hello-service:8080"]

  - job_name: core-template
    metrics_path: /metrics
    static_configs:
      - targets: ["core-template:8081"]

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
