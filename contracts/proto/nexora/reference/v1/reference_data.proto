syntax = "proto3";

package nexora.reference.v1;

option go_package = "github.com/nexora-exchange/nexora/gen/go/nexora/reference/v1;referencev1";

// ReferenceDataService is the internal mTLS-only contract used by trading
// services to load complete, immutable reference-data snapshots. Consumers must
// verify content_hash against document before installing a snapshot.
service ReferenceDataService {
  rpc GetActiveSnapshot(GetActiveSnapshotRequest) returns (GetActiveSnapshotResponse);
  rpc GetVersionSnapshot(GetVersionSnapshotRequest) returns (GetVersionSnapshotResponse);
}

message GetActiveSnapshotRequest {
  string shard_id = 1;
  string request_id = 2;
}

message GetActiveSnapshotResponse {
  int64 version = 1;
  string content_hash = 2;
  string schema_version = 3;
  bytes document = 4;
  int64 effective_at_unix = 5;
  string shard_id = 6;
  bool rollback = 7;
  string request_id = 8;
}

message GetVersionSnapshotRequest {
  string shard_id = 1;
  int64 version = 2;
  string request_id = 3;
}

message GetVersionSnapshotResponse {
  int64 version = 1;
  string content_hash = 2;
  string schema_version = 3;
  bytes document = 4;
  int64 effective_at_unix = 5;
  string shard_id = 6;
  bool rollback = 7;
  string request_id = 8;
}
