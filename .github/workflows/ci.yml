name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Financial invariant gate
        run: cargo test --release -p nexora-types --test invariants -- --ignored
      - name: Domain crate documentation
        run: cargo doc -p nexora-types --no-deps
      - name: Build
        run: cargo build --workspace --all-targets

  financial-verification:
    name: Financial verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-01
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Financial branch coverage
        run: |
          cargo +nightly-2026-10-01 llvm-cov \
            --branch \
            -p nexora-types \
            --all-features \
            --ignore-filename-regex='(^|/)(tests|benches|fuzz)/' \
            --json \
            --output-path coverage.json
          python3 scripts/check_financial_coverage.py coverage.json
      - name: Fuzz corpus regression
        run: cargo test -p nexora-types --all-features --test fuzz_corpus
      - name: Upload branch coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: b02-financial-coverage
          path: coverage.json
          if-no-files-found: warn
          retention-days: 30

  go:
    name: Go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            libs/go/go.sum
            services/hello-service/go.sum
      - name: Format
        run: |
          unformatted="$(gofmt -l libs/go services/hello-service)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: |
          (cd libs/go && go vet ./...)
          (cd services/hello-service && go vet ./...)
      - name: Test
        run: |
          (cd libs/go && go test -race ./...)
          (cd services/hello-service && go test -race ./...)
      - name: Build
        run: |
          (cd libs/go && go build ./...)
          (cd services/hello-service && go build ./...)
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: latest
          working-directory: libs/go
      - name: golangci-lint hello-service
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: latest
          working-directory: services/hello-service

  identity:
    name: Identity (Go, PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: identity_test
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity -d identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEXORA_TEST_DATABASE_URL: postgres://identity:identity_test_only@localhost:5432/identity_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: "1.74.0"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            gen/go/go.sum
            libs/go/go.sum
            services/identity-service/go.sum
      - name: Generate Go identity contract
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          (cd contracts && buf generate)
      - name: Format
        run: |
          unformatted="$(gofmt -l gen/go libs/go services/identity-service)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: |
          (cd services/identity-service && go vet ./...)
      - name: Unit and security tests (race)
        run: |
          (cd services/identity-service && go test -race ./...)
      - name: PostgreSQL 17 integration and concurrency tests
        run: |
          (cd services/identity-service && go test -race -count=1 -run 'Test(PostgresIdentityStoreIntegration|IdentityServicePostgresEndToEnd|IdentityServicePostgresWebAuthn)$' -v ./internal/postgres)
      - name: Build
        run: |
          (cd services/identity-service && go build ./...)
      - name: golangci-lint identity-service
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: latest
          working-directory: services/identity-service

  reference-data:
    name: Reference data (Go, PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reference_test
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity -d reference_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEXORA_TEST_DATABASE_URL: postgres://identity:identity_test_only@localhost:5432/reference_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: "1.74.0"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            gen/go/go.sum
            libs/go/go.sum
            services/reference-data-service/go.sum
      - name: Generate Go contracts
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          (cd contracts && buf generate)
      - name: Format
        run: |
          unformatted="$(gofmt -l gen/go libs/go services/reference-data-service)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: |
          (cd libs/go && go vet ./...)
          (cd services/reference-data-service && go vet ./...)
      - name: Unit, concurrency, and integration tests (race)
        run: |
          (cd libs/go && go test -race ./...)
          (cd services/reference-data-service && go test -race -count=1 ./...)
      - name: PostgreSQL 17 integration evidence
        run: |
          (cd services/reference-data-service && go test -race -count=1 -run 'Test(MigrationsUpDown|ReferenceDataWorkflowPostgres)$' -v ./internal/postgres)
      - name: Golden fixture and deterministic hash
        run: |
          (cd services/reference-data-service && go test -count=1 -run 'TestGoldenFixture|TestFixtureIsValidAndDeterministic$' -v ./internal/seed)
      - name: Build
        run: |
          (cd services/reference-data-service && go build ./...)
      - name: Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd services/reference-data-service && govulncheck ./...)
      - name: golangci-lint reference-data-service
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: latest
          working-directory: services/reference-data-service

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: "1.74.0"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
      - name: Install protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint and build protobuf
        working-directory: contracts
        run: |
          buf lint
          buf build
          buf generate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Install tooling
        run: npm ci --ignore-scripts
      - name: OpenAPI and AsyncAPI
        run: npm run lint:contracts
      - name: Upload generated Go stubs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-go
          path: gen/go
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Dependency and license policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: "1.74.0"
      - name: Generate Go identity contract
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          (cd contracts && buf generate)
      - name: Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd libs/go && govulncheck ./...)
          (cd services/hello-service && govulncheck ./...)
          (cd services/identity-service && govulncheck ./...)
          (cd services/reference-data-service && govulncheck ./...)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Node dependency audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=critical
      - name: Filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"
          skip-dirs: node_modules,target,gen,.git
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: reports/B01/sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: reports/B01/sbom.spdx.json
          retention-days: 90

  sast:
    name: SAST
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Scan
        run: semgrep scan --config auto --error

  compose:
    name: Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint Go Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: services/hello-service/Dockerfile
      - name: Lint identity Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: services/identity-service/Dockerfile
      - name: Lint reference-data Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: services/reference-data-service/Dockerfile
      - name: Lint Rust Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: services/core-template/Dockerfile
      - name: Validate compose model
        run: docker compose config --quiet

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Install tooling
        run: npm ci --ignore-scripts
      - name: Markdown lint
        run: npm run lint:md
