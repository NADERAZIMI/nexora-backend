name: nexora

x-service-env: &service-env
  NEXORA_ENVIRONMENT: development
  NEXORA_LOG_LEVEL: info
  NEXORA_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nexora]

  redpanda:
    image: redpandadata/redpanda:v25.3.17
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [nexora]

  redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nexora]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-nexora}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-nexora}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-nexora_dev_only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [nexora]

  minio:
    # Official MinIO community images are not available on Docker Hub. This
    # community mirror is used for local development only. Pin and verify the
    # official image/digest before any shared or production deployment.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexora_dev_only_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [nexora]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks: [nexora]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [nexora]

  hello-service:
    profiles: [app]
    build:
      context: .
      dockerfile: services/hello-service/Dockerfile
    environment:
      <<: *service-env
      NEXORA_HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      otel-collector:
        condition: service_started
    networks: [nexora]

  core-template:
    profiles: [app]
    build:
      context: .
      dockerfile: services/core-template/Dockerfile
    environment:
      <<: *service-env
      NEXORA_HTTP_ADDR: "0.0.0.0:8081"
    ports:
      - "8081:8081"
    depends_on:
      otel-collector:
        condition: service_started
    networks: [nexora]

volumes:
  postgres-data:
  redpanda-data:
  redis-data:
  clickhouse-data:
  minio-data:
  prometheus-data:

networks:
  nexora:
    driver: bridge
