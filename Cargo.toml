[workspace]
resolver = "3"
members = [
    "crates/nexora-config",
    "crates/nexora-telemetry",
    "crates/nexora-types",
    "services/core-template",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", features = ["http1", "tokio"] }
http-body-util = "0.1.5"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.21"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "catch-panic",
    "limit",
    "request-id",
    "timeout",
    "trace",
    "uuid",
] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
float_cmp = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
